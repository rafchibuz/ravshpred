name: ravshann-predlozhka

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ravshann
      POSTGRES_USER: ravshann
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ravshann}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravshann -d ravshann"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    logging: *default-logging

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_ADDRESS: :8080
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
      DATABASE_URL: postgres://ravshann:${POSTGRES_PASSWORD:-ravshann}@postgres:5432/ravshann?sslmode=disable
      SESSION_COOKIE_NAME: ravshann_session
      SESSION_TTL: 720h
      OWNER_TWITCH_ID: ${OWNER_TWITCH_ID:-}
      OWNER_TWITCH_LOGIN: ${OWNER_TWITCH_LOGIN:-rafchibiskus}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_REDIRECT_URL: ${TWITCH_REDIRECT_URL:-http://localhost:8088/api/auth/twitch/callback}
      TWITCH_CHAT_ACCESS_TOKEN: ${TWITCH_CHAT_ACCESS_TOKEN:-}
      TWITCH_CHAT_REFRESH_TOKEN: ${TWITCH_CHAT_REFRESH_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging

  ravshtok-worker:
    build:
      context: ../workers/ravshtok
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ravshann:${POSTGRES_PASSWORD:-ravshann}@postgres:5432/ravshann?sslmode=disable
      RAVSHTOK_MEDIA_ROOT: /media
      RAVSHTOK_POLL_SECONDS: ${RAVSHTOK_POLL_SECONDS:-5}
      RAVSHTOK_MAX_DURATION_SECONDS: ${RAVSHTOK_MAX_DURATION_SECONDS:-90}
      RAVSHTOK_MAX_SIZE_MB: ${RAVSHTOK_MAX_SIZE_MB:-150}
      RAVSHTOK_INITIAL_RETENTION_DAYS: ${RAVSHTOK_INITIAL_RETENTION_DAYS:-90}
      RAVSHTOK_DOWNLOAD_TIMEOUT_SECONDS: ${RAVSHTOK_DOWNLOAD_TIMEOUT_SECONDS:-240}
      RAVSHTOK_TRANSCODE_TIMEOUT_SECONDS: ${RAVSHTOK_TRANSCODE_TIMEOUT_SECONDS:-900}
      RAVSHTOK_FFMPEG_PRESET: ${RAVSHTOK_FFMPEG_PRESET:-veryfast}
      RAVSHTOK_MAX_ATTEMPTS: ${RAVSHTOK_MAX_ATTEMPTS:-5}
      RAVSHTOK_DIAGNOSTICS_SECONDS: ${RAVSHTOK_DIAGNOSTICS_SECONDS:-300}
    volumes:
      - ravshtok_media:/media
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks: [internal]
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_HTTP_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_started
      ravshtok-worker:
        condition: service_started
    volumes:
      - ravshtok_media:/media:ro
    networks: [internal]
    logging: *default-logging

  backup:
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ravshann:${POSTGRES_PASSWORD:-ravshann}@postgres:5432/ravshann?sslmode=disable
      BACKUP_DIR: /backups
      BACKUP_DAILY_RETENTION: ${BACKUP_DAILY_RETENTION:-7}
      BACKUP_WEEKLY_RETENTION: ${BACKUP_WEEKLY_RETENTION:-4}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_HOST_DIR:-../backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["production"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks: [internal]
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  ravshtok_media:
